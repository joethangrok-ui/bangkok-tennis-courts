# Hourly public-page probe. GitHub cron is UTC and runs every day of the week,
# including Saturday and Sunday. Minute 17 avoids the busiest minute of the hour.
# GitHub may start the job later than :17 when runners are busy.
#
# The schedule runs only after this file is on the default branch (main).
# A push made with GITHUB_TOKEN does not itself trigger the branch Pages build,
# so this workflow also deploys the site with the official Pages actions.
name: Probe booking sources

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: probe-booking-sources
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe public booking sources
        run: python3 scripts/refresh_availability.py

      - name: Commit probe record
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.json
          if git diff --cached --quiet; then
            echo "Probe file unchanged."
          else
            git commit -m "Record booking-source probe"
            git push
          fi

      - name: Prepare Pages artifact
        run: python3 scripts/stage_public_site.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
